<button class="btn js-toggle-dark-mode">Set Dark Mode</button>

<script>
const toggleDarkMode = document.querySelector('.js-toggle-dark-mode');
var storageItem = "colorMode";
var isDarkMode = localStorage.getItem(storageItem);
if (isDarkMode == "0" || isDarkMode == null) {
	isDarkMode = "0";
	localStorage.setItem(storageItem, isDarkMode);
} else if (isDarkMode == "1") {
	jtd.setTheme('dark');
  toggleDarkMode.textContent = 'Set Light Mode'
}
jtd.addEvent(toggleDarkMode, 'click', function(){
  if (jtd.getTheme() === 'dark') {
    jtd.setTheme('light');
    isDarkMode = "0";
    toggleDarkMode.textContent = 'Set Dark Mode';
  } else {
    jtd.setTheme('dark');
    isDarkMode = "1";
    toggleDarkMode.textContent = 'Set Light Mode';
  }
  localStorage.setItem(storageItem, isDarkMode);
});
</script>
